<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>レンジャーズストライク</title>
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #060a14; overflow: hidden; }
  /* iOS: a long press (card detail) must not select the page or open the callout. */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #screen { display: block; outline: none; touch-action: none; cursor: default; }
  #screen.pointer { cursor: pointer; }
  .field {
    position: fixed; display: none; box-sizing: border-box; margin: 0; border: 0; outline: none;
    background: transparent; color: #e2e8f0; caret-color: #38bdf8; border-radius: 8px;
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    -webkit-user-select: text; user-select: text;
  }
  .field:focus { box-shadow: 0 0 0 2px #38bdf8; }
  .field::placeholder { color: #64748b; }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; color: #7dd3fc;
    font: 600 18px/1.4 "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    background: radial-gradient(ellipse at center, #0f1b33 0%, #060a14 70%);
  }
  #boot small { color: #64748b; font-weight: 400; font-size: 13px; }
  #boot.error { color: #fda4af; }
  #bar { width: 220px; height: 4px; border-radius: 2px; background: #1e293b; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: #38bdf8; transition: width .2s; }
</style>
</head>
<body>
<div id="stage"><canvas id="screen" tabindex="0"></canvas></div>
<div id="boot">
  <div>レンジャーズストライク</div>
  <div id="bar"><div></div></div>
  <small id="status">読み込み中…</small>
</div>
<script type="module" src="./host.js"></script>
</body>
</html>
